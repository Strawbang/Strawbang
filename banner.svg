<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t">
  <title id="t">Djamel Bougouffa, full-stack engineer and consultant</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F222E"/>
      <stop offset="1" stop-color="#272B3B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F85D7F" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#F85D7F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1280" height="300" fill="url(#bg)"/>
    <ellipse cx="1120" cy="40" rx="420" ry="260" fill="url(#glow)"/>

    <!-- abstract code block, balances the right side -->
    <g>
      <rect x="944" y="96"  width="180" height="10" rx="5" fill="#F85D7F" opacity="0.45"/>
      <rect x="944" y="122" width="112" height="10" rx="5" fill="#FFFFFF" opacity="0.12"/>
      <rect x="944" y="148" width="210" height="10" rx="5" fill="#F8D866" opacity="0.40"/>
      <rect x="944" y="174" width="88"  height="10" rx="5" fill="#FFFFFF" opacity="0.12"/>
      <rect x="944" y="200" width="150" height="10" rx="5" fill="#F85D7F" opacity="0.25"/>
    </g>

    <rect x="72" y="78" width="6" height="146" rx="3" fill="#F85D7F"/>

    <text x="108" y="134" fill="#F8D866" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="1.5">DJAMEL BOUGOUFFA</text>

    <text x="110" y="178" fill="#E4E7F0" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="400">Full-stack engineer &amp; consultant</text>

    <text x="110" y="219" fill="#8B93A7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" letter-spacing="0.5">Legacy modernization · Rust · AI tooling</text>
  </g>
</svg>
