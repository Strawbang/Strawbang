name: Latest blog post workflow
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull in personal blog
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://djamel-bougouffa.com/rss.xml"
          comment_tag_name: "PERSONAL-BLOG-LIST"
          commit_message: "Updated with the latest blog posts"
      - name: Pull in dev.to posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/strawbang"
          comment_tag_name: "DEVTO-BLOG-LIST"
          max_post_count: 3
          commit_message: "Updated with the latest dev.to posts"
